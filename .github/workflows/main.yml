name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание файлов проекта
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Запуск скрипта создания структуры Android-проекта
        run: |
          echo "Файлы в репозитории:"
          ls -la
          for f in *.py *.py.txt *.ru; do
            if [ -f "$f" ]; then
              echo "Запускаем скрипт: $f"
              python3 "$f"
            fi
          done

      - name: Установка Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Поиск папки проекта и сборка APK-файла
        run: |
          GRADLE_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            GRADLE_FILE=$(find . -maxdepth 3 -name "build.gradle*" | head -n 1)
          fi
          if [ -z "$GRADLE_FILE" ]; then
            echo "ОШИБКА: Скрипт не создал файлы build.gradle или settings.gradle!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Переходим в папку проекта: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Выгрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: Ready-Android-APK
          path: '**/build/outputs/apk/debug/*.apk'
